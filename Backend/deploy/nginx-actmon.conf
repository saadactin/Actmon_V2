# ActMon nginx site — serves the prebuilt UI and proxies the API.
server {
    listen __WEB_PORT__;
    server_name __HOST__;

    root __APP_DIR__/frontend;
    index index.html;
    client_max_body_size 25m;

    # ── Performance ────────────────────────────────────────────────────────
    # gzip: the UI ships 300-430KB JS chunks per page — compression cuts
    # transfer 3-4x and is the single biggest page-load win over a WAN.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml font/woff2;

    # Hashed build assets are immutable — let the browser cache them for good
    # (a new build emits new hashes, so updates are picked up automatically).
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # FastAPI issues 307s for missing trailing slashes; with Host $http_host the
    # redirect keeps the real host:port, but force them relative too so the
    # public web port is never dropped (which would send the browser to :80).
    proxy_redirect http://127.0.0.1/ /;
    proxy_redirect http://127.0.0.1:__WEB_PORT__/ /;
    proxy_redirect http://__HOST__/ /;
    proxy_redirect http://__HOST__:__WEB_PORT__/ /;

    # Cloud Discovery microservice (must precede the generic /api rule)
    location /api/v1/cloud/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Terminal websocket
    location /api/v1/terminal/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # Main API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback — all other routes serve the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
