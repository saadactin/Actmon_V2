# ActMon nginx site — serves the prebuilt UI and proxies the API.
server {
    listen __WEB_PORT__;
    server_name __HOST__;

    root __APP_DIR__/frontend;
    index index.html;
    client_max_body_size 25m;

    # FastAPI issues 307s for missing trailing slashes; with Host $http_host the
    # redirect keeps the real host:port, but force them relative too so the
    # public web port is never dropped (which would send the browser to :80).
    proxy_redirect http://127.0.0.1/ /;
    proxy_redirect http://127.0.0.1:__WEB_PORT__/ /;
    proxy_redirect http://__HOST__/ /;
    proxy_redirect http://__HOST__:__WEB_PORT__/ /;

    # Cloud Discovery microservice (must precede the generic /api rule)
    location /api/v1/cloud/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Terminal websocket
    location /api/v1/terminal/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # Main API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback — all other routes serve the React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
