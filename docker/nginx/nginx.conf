# Adapted from Backend/deploy/nginx-actmon.conf for docker-compose: the
# proxy targets are container DNS names (compose service names, resolved via
# Docker's embedded DNS) instead of 127.0.0.1:<port> — nothing in this
# container can reach "localhost" and mean the backend/cloud containers.
# Docker's embedded DNS — resolves service names lazily, PER REQUEST, instead
# of once at nginx startup. Without this, proxy_pass with a bare hostname
# resolves at config-load time; if that service isn't up yet (or is
# mid-restart) when nginx starts, nginx fails to start AT ALL — not just that
# one route, the whole server, including the static frontend it also serves.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/xml font/woff2;

    # Hashed build assets are immutable — a new build emits new hashes.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    proxy_redirect off;

    # Cloud Discovery microservice (must precede the generic /api rule).
    # proxy_pass targets a variable, not a bare hostname, so it goes through
    # the `resolver` above (lazy, per-request) instead of resolving once at
    # startup — see the comment on `resolver` for why that distinction matters.
    location /api/v1/cloud/ {
        set $cloud_upstream http://cloud:8001;
        proxy_pass $cloud_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Terminal websocket.
    location /api/v1/terminal/ws {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
    }

    # Main API.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    # SPA fallback — all other routes serve the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
