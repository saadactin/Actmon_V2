<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ACTMON — Interactive Platform Documentation</title>
<meta name="description" content="An explorable 3D map of the ACTMON monitoring platform, built from repository inspection." />
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#05070f; --bg-2:#080d1a; --panel:rgba(12,19,36,.82); --panel-solid:#0b1223;
  --line:rgba(120,165,225,.18); --line-str:rgba(120,165,225,.34);
  --fg:#eaf2ff; --muted:#93a8c9; --dim:#6a7f9f;
  --accent:#35c3f3; --accent-2:#6f7cf7; --teal:#2fd6a6;
  --ok:#3ad39a; --warn:#f2b23c; --bad:#ff6b7f; --info:#7cd6f0;
  --r:14px; --r-sm:9px;
  --ff:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --fm:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  --dur:.55s;
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:.001s } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--ff)}
body.reduced *{animation-duration:.001s!important;transition-duration:.001s!important}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,165,225,.25);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#stage{position:fixed;inset:0}
#canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 35%,rgba(2,4,10,.72) 100%)}

/* ── loading ────────────────────────────────────────────────────────────── */
#loader{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 40%,#0b1428,#04060d 70%);transition:opacity .6s}
#loader.gone{opacity:0;pointer-events:none}
.ld-w{text-align:center;max-width:430px;padding:0 24px}
.ld-mark{width:96px;height:96px;margin:0 auto 26px;position:relative}
.ld-ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;
  border-top-color:var(--accent);border-right-color:var(--accent-2);animation:spin 1.25s cubic-bezier(.5,.1,.4,.9) infinite}
.ld-ring:nth-child(2){inset:14px;border-top-color:var(--teal);border-right-color:transparent;animation-duration:1.8s;animation-direction:reverse}
.ld-ring:nth-child(3){inset:28px;border-top-color:rgba(255,255,255,.5);border-right-color:transparent;animation-duration:2.4s}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-t{font-size:30px;font-weight:200;letter-spacing:.42em;margin:0 0 8px;text-indent:.42em}
.ld-s{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.6}
.ld-bar{height:2px;background:rgba(120,165,225,.16);border-radius:2px;overflow:hidden}
.ld-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.ld-step{margin-top:12px;font-size:11px;color:var(--dim);font-family:var(--fm);min-height:15px}

/* ── top bar ────────────────────────────────────────────────────────────── */
#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:linear-gradient(180deg,rgba(5,7,15,.94),rgba(5,7,15,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:4px 6px;border-radius:var(--r-sm)}
.brand:hover{background:rgba(120,165,225,.08)}
.brand-dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 16px rgba(53,195,243,.5)}
.brand-t{font-size:15px;font-weight:600;letter-spacing:.22em}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.crumb{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:7px;white-space:nowrap}
.crumb:hover{color:var(--fg);background:rgba(120,165,225,.1)}
.crumb[aria-current]{color:var(--fg);font-weight:600}
.crumb-sep{color:var(--dim);font-size:11px}
.spacer{flex:1}
.lvl{font-family:var(--fm);font-size:10.5px;color:var(--dim);border:1px solid var(--line);
  padding:4px 9px;border-radius:99px;white-space:nowrap}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{background:rgba(18,28,50,.8);border:1px solid var(--line);color:var(--muted);cursor:pointer;
  padding:7px 12px;border-radius:9px;font-size:12px;display:inline-flex;align-items:center;gap:6px;
  transition:border-color .2s,color .2s,background .2s;white-space:nowrap}
.btn:hover:not(:disabled){color:var(--fg);border-color:var(--line-str);background:rgba(30,45,75,.85)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.on{color:#04121c;background:var(--accent);border-color:var(--accent);font-weight:600}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:15px;height:15px;flex:none}

/* ── search ─────────────────────────────────────────────────────────────── */
#searchWrap{position:relative}
#search{background:rgba(18,28,50,.8);border:1px solid var(--line);border-radius:9px;color:var(--fg);
  padding:7px 11px 7px 30px;font-size:12px;width:190px;font-family:inherit}
#search::placeholder{color:var(--dim)}
#search:focus{outline:none;border-color:var(--accent);width:250px}
#searchWrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim)}
#results{position:absolute;top:calc(100% + 6px);right:0;width:340px;max-height:60vh;overflow:auto;
  background:var(--panel-solid);border:1px solid var(--line-str);border-radius:var(--r);
  box-shadow:0 24px 60px rgba(0,0,0,.6);display:none;padding:6px}
#results.show{display:block}
.res{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:9px;cursor:pointer}
.res:hover,.res.sel{background:rgba(53,195,243,.13)}
.res b{display:block;font-size:13px;font-weight:600}
.res span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.res-none{padding:16px;text-align:center;color:var(--dim);font-size:12px}

/* ── bottom bar ─────────────────────────────────────────────────────────── */
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:12px 16px;background:linear-gradient(0deg,rgba(5,7,15,.94),rgba(5,7,15,0));flex-wrap:wrap;pointer-events:none}
#bottom>*{pointer-events:auto}
.hint{font-size:11px;color:var(--dim);margin-left:auto}
@media(max-width:900px){.hint{display:none}}

/* ── side panel ─────────────────────────────────────────────────────────── */
#panel{position:fixed;top:0;right:0;width:min(470px,100vw);height:100%;z-index:50;
  background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-left:1px solid var(--line-str);transform:translateX(100%);transition:transform var(--dur) cubic-bezier(.3,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:-30px 0 70px rgba(0,0,0,.5)}
#panel.open{transform:none}
.p-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);flex:none;position:relative}
.p-kicker{font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.p-title{font-size:21px;font-weight:600;margin:0;line-height:1.24;padding-right:38px}
.p-sub{font-size:12.5px;color:var(--muted);margin:7px 0 0;line-height:1.55}
.p-close{position:absolute;top:16px;right:16px;background:none;border:1px solid var(--line);
  color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.p-close:hover{color:var(--fg);border-color:var(--line-str)}
.p-body{flex:1;overflow-y:auto;padding:18px 20px 34px}
.p-body::-webkit-scrollbar-track{background:transparent}

.sec{margin-bottom:20px}
.sec-h{font-family:var(--fm);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin:0 0 8px;display:flex;align-items:center;gap:7px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--line)}
.sec p{margin:0 0 9px;font-size:13.5px;line-height:1.62;color:#cfdcf0}
.sec p:last-child{margin-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:rgba(120,165,225,.06)}
.chip.ok{color:var(--ok);border-color:rgba(58,211,154,.35);background:rgba(58,211,154,.09)}
.chip.warn{color:var(--warn);border-color:rgba(242,178,60,.35);background:rgba(242,178,60,.09)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,127,.35);background:rgba(255,107,127,.09)}
.chip.info{color:var(--info);border-color:rgba(124,214,240,.3);background:rgba(124,214,240,.08)}

ul.list{margin:0;padding-left:17px}
ul.list li{font-size:13px;line-height:1.6;color:#cfdcf0;margin-bottom:5px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;color:var(--fg);text-align:right;font-family:var(--fm);font-size:12px;word-break:break-word}

.note{border-left:2px solid var(--accent);padding:9px 12px;background:rgba(53,195,243,.07);
  border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.58;color:#cfdcf0}
.note.warn{border-left-color:var(--warn);background:rgba(242,178,60,.07)}
.note.bad{border-left-color:var(--bad);background:rgba(255,107,127,.07)}
.note.ok{border-left-color:var(--ok);background:rgba(58,211,154,.07)}
.note b{color:var(--fg)}

pre.code{font-family:var(--fm);font-size:11.5px;line-height:1.62;background:rgba(3,7,16,.75);
  border:1px solid var(--line);border-radius:9px;padding:11px 13px;overflow-x:auto;margin:0;color:#b8e6ff;white-space:pre}
.srcline{font-family:var(--fm);font-size:10.5px;color:var(--dim);word-break:break-word;line-height:1.55}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(120,165,225,.06);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile dt{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.tile dd{margin:4px 0 0;font-size:15px;font-weight:600;font-family:var(--fm);word-break:break-word}

.navlist{display:flex;flex-direction:column;gap:5px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(120,165,225,.05);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.18s}
.navbtn:hover{background:rgba(53,195,243,.12);border-color:var(--accent);transform:translateX(3px)}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navbtn b{font-size:13px;font-weight:600;display:block}
.navbtn small{font-size:11px;color:var(--dim);display:block;margin-top:2px;line-height:1.45}
.navbtn .swatch{width:9px;height:9px;border-radius:3px;flex:none}
.navbtn .arrow{margin-left:auto;color:var(--dim);flex:none}

/* walkthrough */
.wt-step{border-left:2px solid var(--line-str);padding:0 0 18px 16px;position:relative}
.wt-step:last-child{padding-bottom:0}
.wt-step::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--bg);border:2px solid var(--accent)}
.wt-step.done::before{background:var(--accent)}
.wt-t{font-size:13.5px;font-weight:600;margin:0 0 5px}
.wt-b{font-size:12.5px;line-height:1.62;color:#cfdcf0;margin:0 0 8px}

/* tour */
#tour{position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(140%);z-index:45;
  width:min(660px,calc(100vw - 32px));background:var(--panel-solid);border:1px solid var(--line-str);
  border-radius:var(--r);padding:15px 18px;box-shadow:0 26px 60px rgba(0,0,0,.6);
  transition:transform var(--dur) cubic-bezier(.3,.9,.3,1)}
#tour.open{transform:translateX(-50%)}
.tour-top{display:flex;align-items:baseline;gap:10px;margin-bottom:7px}
.tour-n{font-family:var(--fm);font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.tour-t{font-size:16px;font-weight:600;margin:0}
.tour-b{font-size:12.5px;color:#cfdcf0;line-height:1.6;margin:0 0 12px}
.tour-ctl{display:flex;align-items:center;gap:8px}
.tour-prog{flex:1;height:2px;background:rgba(120,165,225,.18);border-radius:2px;overflow:hidden}
.tour-prog i{display:block;height:100%;background:var(--accent);transition:width .35s}

/* 2D fallback */
#flat{position:fixed;inset:0;z-index:60;background:var(--bg-2);overflow-y:auto;display:none;padding:74px 20px 80px}
#flat.show{display:block}
.flat-w{max-width:940px;margin:0 auto}
.flat-h{font-size:26px;font-weight:300;letter-spacing:.06em;margin:0 0 6px}
.flat-s{color:var(--muted);font-size:13px;margin:0 0 26px;line-height:1.6}
.flat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px;margin-bottom:26px}
.flat-card{background:rgba(120,165,225,.05);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;text-align:left;cursor:pointer;transition:.18s;color:inherit;font:inherit}
.flat-card:hover{border-color:var(--accent);background:rgba(53,195,243,.09)}
.flat-card b{font-size:14px;display:block;margin-bottom:5px}
.flat-card p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
.flat-sec-h{font-family:var(--fm);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dim);margin:0 0 11px;display:flex;align-items:center;gap:8px}
.flat-sec-h::after{content:'';flex:1;height:1px;background:var(--line)}

/* status legend + toast */
#legend{position:fixed;left:16px;bottom:58px;z-index:35;display:flex;gap:7px;flex-wrap:wrap;max-width:60vw}
@media(max-width:760px){#legend{display:none}}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-14px);z-index:70;background:var(--panel-solid);
  border:1px solid var(--line-str);border-radius:10px;padding:10px 16px;font-size:12.5px;opacity:0;
  pointer-events:none;transition:.3s;box-shadow:0 14px 40px rgba(0,0,0,.5);max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#labels{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:600;letter-spacing:.03em;
  color:#dcebff;text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 20px rgba(0,0,0,.8);white-space:nowrap;
  transition:opacity .3s;pointer-events:none;padding:2px 6px}
.lbl.dim{opacity:.34}

@media(max-width:620px){
  .brand-t{display:none}
  #search{width:120px}#search:focus{width:150px}
  #panel{width:100vw}
  .tiles{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="stage"><canvas id="canvas"></canvas></div>
<div id="vignette"></div>
<div id="labels"></div>

<!-- loading -->
<div id="loader">
  <div class="ld-w">
    <div class="ld-mark"><div class="ld-ring"></div><div class="ld-ring"></div><div class="ld-ring"></div></div>
    <h1 class="ld-t">ACTMON</h1>
    <p class="ld-s">Interactive platform documentation<br />Built from repository inspection</p>
    <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
    <p class="ld-step" id="ldStep">Initialising…</p>
  </div>
</div>

<!-- top -->
<header id="top">
  <button class="brand" id="home" title="Back to the platform overview">
    <span class="brand-dot"></span><span class="brand-t">ACTMON</span>
  </button>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <span class="spacer"></span>
  <span class="lvl" id="lvl">Level 0 · Platform</span>
  <div id="searchWrap">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search features…" autocomplete="off" aria-label="Search features" />
    <div id="results" role="listbox"></div>
  </div>
</header>

<!-- bottom -->
<footer id="bottom">
  <button class="btn" id="back" title="Back (Backspace)" disabled>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Back
  </button>
  <button class="btn" id="fwd" title="Forward" disabled>Forward
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="btn" id="reset" title="Reset to overview (0)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset
  </button>
  <button class="btn" id="tourBtn" title="Guided presentation (T)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9z"/></svg>Guided tour
  </button>
  <button class="btn" id="flatBtn" title="2D accessible view (F)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>2D view
  </button>
  <button class="btn" id="motionBtn" title="Reduce motion (M)">Reduce motion</button>
  <button class="btn" id="fsBtn" title="Full screen">Full screen</button>
  <span class="hint">Scroll to zoom · drag to orbit · click a node · Esc closes · ? for keys</span>
</footer>

<div id="legend"></div>

<!-- side panel -->
<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="pTitle">
  <div class="p-head">
    <div class="p-kicker" id="pKicker"></div>
    <h2 class="p-title" id="pTitle"></h2>
    <p class="p-sub" id="pSub"></p>
    <button class="p-close" id="pClose" aria-label="Close panel">&times;</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<!-- tour -->
<div id="tour" role="region" aria-label="Guided tour">
  <div class="tour-top"><span class="tour-n" id="tourN"></span><h3 class="tour-t" id="tourT"></h3></div>
  <p class="tour-b" id="tourB"></p>
  <div class="tour-ctl">
    <button class="btn" id="tourPrev">Previous</button>
    <button class="btn on" id="tourNext">Next</button>
    <div class="tour-prog"><i id="tourProg"></i></div>
    <button class="btn" id="tourExit">Exit tour</button>
  </div>
</div>

<!-- 2D fallback -->
<div id="flat"><div class="flat-w" id="flatBody"></div></div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="./actmon-data.js"></script>
<script src="./actmon-app.js"></script>
</body>
</html>
