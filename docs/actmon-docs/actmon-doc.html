<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ACTMON Universe — Interactive Platform Documentation</title>
<meta name="description" content="An explorable 3D map of the ACTMON monitoring platform, built from repository inspection." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ── tokens ─────────────────────────────────────────────────────────────
   One scale, used everywhere. The previous version had ad-hoc pixel sizes
   scattered through the CSS, which is why the hierarchy read as weak. */
:root{
  --bg:#04060d; --bg-2:#070c18; --surface:rgba(11,18,34,.86); --surface-2:#0a1120;
  --line:rgba(120,165,225,.16); --line-str:rgba(120,165,225,.32);
  --fg:#eef4ff; --muted:#9db0cf; --dim:#6d82a3;
  --accent:#35c3f3; --accent-2:#6f7cf7; --teal:#2fd6a6;
  --ok:#3ad39a; --warn:#f2b23c; --bad:#ff6b7f; --info:#7cd6f0;

  /* type scale — 1.25 ratio, capped so nothing is ever below 12px */
  --t-hero:2.25rem; --t-env:1.5rem; --t-title:1.3125rem; --t-head:1rem;
  --t-body:.875rem; --t-ui:.8125rem; --t-meta:.75rem; --t-micro:.6875rem;
  --lh-tight:1.2; --lh-head:1.35; --lh-body:1.62;

  --ff:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  --fm:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --r:14px; --r-sm:10px; --r-xs:7px;
  --dur:.5s; --ease:cubic-bezier(.32,.72,.28,1);
}
@media (prefers-reduced-motion: reduce){ :root{ --dur:.001s } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:var(--ff);font-size:16px;font-feature-settings:'cv05','ss01';-webkit-font-smoothing:antialiased}
body.reduced *{animation-duration:.001s!important;transition-duration:.001s!important}
button,input{font-family:inherit}
.dim{color:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,165,225,.22);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(120,165,225,.36)}
::-webkit-scrollbar-track{background:transparent}

#stage{position:fixed;inset:0}
#canvas{display:block;width:100%;height:100%;cursor:grab}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at 50% 44%,transparent 32%,rgba(2,4,10,.78) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:12;overflow:hidden}

/* ── loading ────────────────────────────────────────────────────────────── */
#loader{position:fixed;inset:0;z-index:95;display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 38%,#0a1428,#03050b 72%);transition:opacity .65s var(--ease)}
#loader.gone{opacity:0;pointer-events:none}
.ld-w{text-align:center;max-width:440px;padding:0 24px}
.ld-mark{width:104px;height:104px;margin:0 auto 30px;position:relative}
.ld-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid transparent;
  border-top-color:var(--accent);border-right-color:var(--accent-2);animation:spin 1.3s var(--ease) infinite}
.ld-ring:nth-child(2){inset:15px;border-top-color:var(--teal);border-right-color:transparent;animation-duration:1.9s;animation-direction:reverse}
.ld-ring:nth-child(3){inset:30px;border-top-color:rgba(255,255,255,.45);border-right-color:transparent;animation-duration:2.6s}
.ld-core{position:absolute;inset:42px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-t{font-size:var(--t-hero);font-weight:200;letter-spacing:.4em;margin:0 0 10px;text-indent:.4em;line-height:1}
.ld-s{color:var(--muted);font-size:var(--t-body);margin:0 0 28px;line-height:var(--lh-body);font-weight:400}
.ld-bar{height:2px;background:rgba(120,165,225,.14);border-radius:2px;overflow:hidden}
.ld-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s var(--ease)}
.ld-step{margin-top:14px;font-size:var(--t-micro);color:var(--dim);font-family:var(--fm);min-height:16px;letter-spacing:.02em}

/* ── top bar ────────────────────────────────────────────────────────────── */
#top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:14px 18px 22px;background:linear-gradient(180deg,rgba(4,6,13,.95) 30%,rgba(4,6,13,0));pointer-events:none}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;background:none;border:0;padding:5px 7px;border-radius:var(--r-sm);color:inherit}
.brand:hover{background:rgba(120,165,225,.08)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand-dot{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px rgba(53,195,243,.45);flex:none}
.brand-t{font-size:var(--t-head);font-weight:600;letter-spacing:.2em}
.crumbs{display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-width:0}
.crumb{background:none;border:0;color:var(--muted);cursor:pointer;padding:5px 9px;border-radius:var(--r-xs);
  font-size:var(--t-ui);font-weight:500;white-space:nowrap;transition:color .2s,background .2s}
.crumb:hover{color:var(--fg);background:rgba(120,165,225,.1)}
.crumb[aria-current]{color:var(--fg);font-weight:600}
.crumb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.crumb-sep{color:var(--dim);font-size:var(--t-ui)}
.spacer{flex:1}
.lvl{font-family:var(--fm);font-size:var(--t-micro);color:var(--dim);border:1px solid var(--line);
  padding:5px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}

/* ── environment title (level identity) ─────────────────────────────────── */
#envBar{position:fixed;top:64px;left:20px;z-index:14;pointer-events:none;opacity:0;
  transform:translateY(-8px);transition:opacity .6s var(--ease),transform .6s var(--ease);max-width:min(46ch,52vw)}
#envBar.show{opacity:1;transform:none}
#envTitle{font-size:var(--t-env);font-weight:300;letter-spacing:.015em;margin:0;line-height:var(--lh-tight);
  text-shadow:0 2px 20px rgba(0,0,0,.9)}
#envSub{font-size:var(--t-ui);color:var(--muted);margin:5px 0 0;line-height:var(--lh-head);font-weight:400;
  text-shadow:0 1px 12px rgba(0,0,0,.9)}
@media(max-width:900px){#envBar{display:none}}

/* ── buttons ────────────────────────────────────────────────────────────── */
.btn{background:rgba(16,26,46,.82);border:1px solid var(--line);color:var(--muted);cursor:pointer;
  padding:8px 13px;border-radius:var(--r-sm);font-size:var(--t-ui);font-weight:500;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:border-color .2s,color .2s,background .2s}
.btn:hover:not(:disabled){color:var(--fg);border-color:var(--line-str);background:rgba(28,42,70,.9)}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn.on{color:#03121c;background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary{color:#03121c;background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:#4dd0ff;color:#03121c}
.btn.wide{width:100%;justify-content:center;margin-top:2px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:15px;height:15px;flex:none}

/* ── search ─────────────────────────────────────────────────────────────── */
#searchWrap{position:relative}
#search{background:rgba(16,26,46,.82);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--fg);
  padding:8px 12px 8px 32px;font-size:var(--t-ui);width:200px;transition:width .25s var(--ease),border-color .2s}
#search::placeholder{color:var(--dim)}
#search:focus{outline:none;border-color:var(--accent);width:262px}
#searchWrap>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--dim)}
#results{position:absolute;top:calc(100% + 7px);right:0;width:348px;max-height:62vh;overflow:auto;
  background:var(--surface-2);border:1px solid var(--line-str);border-radius:var(--r);
  box-shadow:0 26px 64px rgba(0,0,0,.66);display:none;padding:6px;z-index:50}
#results.show{display:block}
.res{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:var(--r-xs);cursor:pointer;color:inherit}
.res:hover,.res.sel{background:rgba(53,195,243,.13)}
.res b{display:block;font-size:var(--t-body);font-weight:600}
.res span{display:block;font-size:var(--t-meta);color:var(--dim);margin-top:2px}
.res-none{padding:18px;text-align:center;color:var(--dim);font-size:var(--t-ui)}

/* ── bottom bar ─────────────────────────────────────────────────────────── */
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:22px 18px 14px;background:linear-gradient(0deg,rgba(4,6,13,.95) 30%,rgba(4,6,13,0));flex-wrap:wrap;pointer-events:none}
#bottom>*{pointer-events:auto}
.hint{font-size:var(--t-meta);color:var(--dim);margin-left:auto;font-weight:400}
@media(max-width:1000px){.hint{display:none}}

/* ── proximity readout ──────────────────────────────────────────────────── */
#prox{position:fixed;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);z-index:30;
  visibility:hidden;
  background:var(--surface-2);border:1px solid var(--line-str);border-radius:99px;padding:7px 16px;
  display:flex;align-items:baseline;gap:10px;opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:80vw}
#prox.show{opacity:1;visibility:visible;transform:translateX(-50%)}
#prox b{font-size:var(--t-body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prox span{font-size:var(--t-micro);color:var(--dim);white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}

/* ── 3D labels (three tiers) ───────────────────────────────────────────────
   t0 far: a dot. t1 mid: the name. t2 near/hover: name + purpose + action.
   This is the contextual system that replaces permanently-glued text. */
.lbl3{position:absolute;left:0;top:0;pointer-events:none;display:flex;align-items:center;gap:7px;
  transition:opacity .35s var(--ease);will-change:transform}
.lbl3-dot{width:7px;height:7px;border-radius:50%;background:rgba(190,222,255,.85);
  box-shadow:0 0 10px rgba(120,190,255,.7);flex:none;transition:all .3s var(--ease)}
.lbl3-body{display:flex;flex-direction:column;gap:1px;min-width:0}
.lbl3-name{font-size:var(--t-ui);font-weight:600;color:#e6f1ff;letter-spacing:.01em;white-space:nowrap;
  text-shadow:0 1px 10px rgba(0,0,0,.95),0 0 22px rgba(0,0,0,.85);line-height:1.25}
.lbl3-sub{font-size:var(--t-meta);color:#a9c0de;max-width:30ch;line-height:1.35;font-weight:400;
  text-shadow:0 1px 8px rgba(0,0,0,.95);display:none}
.lbl3-cta{font-size:var(--t-micro);color:var(--accent);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;margin-top:2px;display:none;text-shadow:0 1px 8px rgba(0,0,0,.95)}
.lbl3.t0 .lbl3-body{display:none}
.lbl3.t1 .lbl3-sub,.lbl3.t1 .lbl3-cta{display:none}
.lbl3.t2{background:rgba(6,12,24,.7);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px}
.lbl3.t2 .lbl3-sub{display:block}
.lbl3.t2 .lbl3-cta{display:block}
.lbl3.t2 .lbl3-dot{width:9px;height:9px;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.lbl3.sel{border-color:var(--accent);box-shadow:0 0 0 1px rgba(53,195,243,.35),0 12px 30px rgba(0,0,0,.5)}
.lbl3.tone-accent .lbl3-dot{background:var(--accent)}
.lbl3.tone-ok .lbl3-dot{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.lbl3.tone-warn .lbl3-dot{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.lbl3.tone-bad .lbl3-dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.lbl3.tone-info .lbl3-dot{background:var(--info)}

/* ── side panel ─────────────────────────────────────────────────────────── */
#panel{position:fixed;top:0;right:0;width:min(478px,100vw);height:100%;z-index:50;
  background:var(--surface);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-left:1px solid var(--line-str);transform:translateX(100%);
  transition:transform var(--dur) var(--ease);display:flex;flex-direction:column;
  box-shadow:-34px 0 80px rgba(0,0,0,.55)}
#panel.open{transform:none}
.p-head{padding:20px 22px 15px;border-bottom:1px solid var(--line);flex:none;position:relative}
.p-kicker{font-family:var(--fm);font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;font-weight:500}
.p-title{font-size:var(--t-title);font-weight:600;margin:0;line-height:var(--lh-tight);padding-right:40px;letter-spacing:-.005em}
.p-sub{font-size:var(--t-ui);color:var(--muted);margin:8px 0 0;line-height:var(--lh-head)}
.p-close{position:absolute;top:17px;right:17px;background:none;border:1px solid var(--line);
  color:var(--muted);width:31px;height:31px;border-radius:var(--r-xs);cursor:pointer;font-size:17px;line-height:1}
.p-close:hover{color:var(--fg);border-color:var(--line-str)}
.p-body{flex:1;overflow-y:auto;padding:19px 22px 40px;overscroll-behavior:contain}

.sec{margin-bottom:22px}
.sec-h{font-family:var(--fm);font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 9px;display:flex;align-items:center;gap:8px;font-weight:500}
.sec-h::after{content:'';flex:1;height:1px;background:var(--line)}
.sec p{margin:0 0 10px;font-size:var(--t-body);line-height:var(--lh-body);color:#d3e0f2}
.sec p:last-child{margin-bottom:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:var(--t-meta);padding:4px 10px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted);background:rgba(120,165,225,.06);font-weight:500;white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(58,211,154,.32);background:rgba(58,211,154,.09)}
.chip.warn{color:var(--warn);border-color:rgba(242,178,60,.32);background:rgba(242,178,60,.09)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,127,.32);background:rgba(255,107,127,.09)}
.chip.info{color:var(--info);border-color:rgba(124,214,240,.28);background:rgba(124,214,240,.08)}

ul.list{margin:0;padding-left:18px}
ul.list li{font-size:var(--t-body);line-height:var(--lh-body);color:#d3e0f2;margin-bottom:5px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:var(--t-ui);margin:0}
.kv dt{color:var(--dim);font-weight:400}
.kv dd{margin:0;color:var(--fg);text-align:right;font-family:var(--fm);font-size:var(--t-meta);
  word-break:break-word;font-weight:500}
.kv dd.v-ok{color:var(--ok)} .kv dd.v-warn{color:var(--warn)} .kv dd.v-bad{color:var(--bad)} .kv dd.v-info{color:var(--info)}

.note{border-left:2px solid var(--accent);padding:10px 13px;background:rgba(53,195,243,.07);
  border-radius:0 var(--r-xs) var(--r-xs) 0;font-size:var(--t-ui);line-height:var(--lh-body);color:#d3e0f2}
.note.warn{border-left-color:var(--warn);background:rgba(242,178,60,.07)}
.note.bad{border-left-color:var(--bad);background:rgba(255,107,127,.07)}
.note.ok{border-left-color:var(--ok);background:rgba(58,211,154,.07)}
.note b{color:var(--fg);font-weight:600}

pre.code{font-family:var(--fm);font-size:var(--t-meta);line-height:1.66;background:rgba(3,7,16,.8);
  border:1px solid var(--line);border-radius:var(--r-xs);padding:12px 14px;overflow-x:auto;margin:0;
  color:#b2e4ff;white-space:pre;font-weight:400}
.srcline{font-family:var(--fm);font-size:var(--t-micro);color:var(--dim);word-break:break-word;line-height:1.55;margin:8px 0 0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(120,165,225,.06);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px}
.tile dt{font-size:var(--t-micro);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:500}
.tile dd{margin:5px 0 0;font-size:var(--t-head);font-weight:600;font-family:var(--fm);word-break:break-word}

.navlist{display:flex;flex-direction:column;gap:5px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:rgba(120,165,225,.05);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;cursor:pointer;color:inherit;
  transition:background .18s,border-color .18s,transform .18s var(--ease)}
.navbtn:hover{background:rgba(53,195,243,.12);border-color:var(--accent);transform:translateX(3px)}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.navbtn .nb-txt{min-width:0;flex:1}
.navbtn b{font-size:var(--t-body);font-weight:600;display:block;line-height:1.35}
.navbtn small{font-size:var(--t-meta);color:var(--dim);display:block;margin-top:3px;line-height:1.45}
.navbtn .swatch{width:9px;height:9px;border-radius:3px;flex:none}
.navbtn .arrow{margin-left:auto;color:var(--dim);flex:none;font-size:var(--t-head)}

.cmp{width:100%;border-collapse:collapse;font-size:var(--t-ui)}
.cmp th{text-align:left;padding-bottom:7px;color:var(--dim);font-size:var(--t-micro);
  letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.cmp td{padding:6px 8px 6px 0;vertical-align:middle}
.cmp .c-name{font-weight:600}
.cmp .c-reach{font-family:var(--fm);font-size:var(--t-micro);color:var(--dim)}
.cmp-note{margin-top:10px;font-size:var(--t-meta);color:var(--muted);line-height:var(--lh-body)}

.finding{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:9px;background:rgba(120,165,225,.04)}
.f-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.f-top b{font-size:var(--t-body);font-weight:600}
.f-ev{font-family:var(--fm);font-size:var(--t-micro);background:rgba(3,7,16,.6);padding:7px 10px;
  border-radius:var(--r-xs);margin:0 0 8px;line-height:1.5;color:#cfe4f7}
.f-act{font-size:var(--t-ui);line-height:var(--lh-body);margin:0 0 8px;color:#d3e0f2}
.f-to{font-size:var(--t-meta);color:var(--dim);font-style:italic;margin:8px 0 0;line-height:1.5}

.viagroup{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px}
.via-h{font-size:var(--t-ui);font-weight:600;margin:0 0 3px}
.via-d{font-size:var(--t-meta);color:var(--dim);margin:0 0 9px;line-height:1.5}
.privrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.privrow code{font-family:var(--fm);font-size:var(--t-meta);color:#cfe4f7}
.privrow span{font-family:var(--fm);font-size:var(--t-micro);color:var(--dim);text-align:right;white-space:nowrap}

.wt-step{border-left:2px solid var(--line-str);padding:0 0 20px 17px;position:relative}
.wt-step:last-child{padding-bottom:0}
.wt-step::before{content:'';position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;
  background:var(--bg);border:2px solid var(--accent)}
.wt-step.done::before{background:var(--accent)}
.wt-t{font-size:var(--t-body);font-weight:600;margin:0 0 6px}
.wt-b{font-size:var(--t-ui);line-height:var(--lh-body);color:#d3e0f2;margin:0 0 9px}

/* ── tour ───────────────────────────────────────────────────────────────── */
/* Hidden by opacity and visibility, NOT by a percentage translate. A
   percentage translate is relative to the element's own height, and before the
   tour has ever been opened this panel has no chapter text in it — so it is
   short, translateY(150%) moves it barely 150px, and a slice of it stayed
   visible under the control bar. Height can no longer matter. */
#tour{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(24px);z-index:45;
  width:min(690px,calc(100vw - 32px));background:var(--surface-2);border:1px solid var(--line-str);
  border-radius:var(--r);padding:17px 20px;box-shadow:0 28px 70px rgba(0,0,0,.66);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease),visibility 0s linear var(--dur)}
#tour.open{transform:translateX(-50%);opacity:1;visibility:visible;pointer-events:auto;
  transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease),visibility 0s}
.tour-top{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.tour-n{font-family:var(--fm);font-size:var(--t-micro);color:var(--accent);letter-spacing:.1em;font-weight:500}
.tour-t{font-size:var(--t-head);font-weight:600;margin:0;letter-spacing:-.005em}
.tour-b{font-size:var(--t-ui);color:#d3e0f2;line-height:var(--lh-body);margin:0 0 13px}
.tour-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tour-prog{flex:1;min-width:60px;height:2px;background:rgba(120,165,225,.18);border-radius:2px;overflow:hidden}
.tour-prog i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}

/* ── 2D fallback ────────────────────────────────────────────────────────── */
#flat{position:fixed;inset:0;z-index:60;background:var(--bg-2);overflow-y:auto;display:none;padding:80px 22px 86px}
#flat.show{display:block}
.flat-w{max-width:980px;margin:0 auto}
.flat-h{font-size:1.75rem;font-weight:300;letter-spacing:.02em;margin:0 0 8px}
.flat-s{color:var(--muted);font-size:var(--t-body);margin:0 0 30px;line-height:var(--lh-body);max-width:72ch}
.flat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:11px;margin-bottom:30px}
.flat-card{background:rgba(120,165,225,.05);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;text-align:left;cursor:pointer;color:inherit;transition:border-color .18s,background .18s}
.flat-card:hover{border-color:var(--accent);background:rgba(53,195,243,.09)}
.flat-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.flat-card b{font-size:var(--t-body);display:block;margin-bottom:6px;font-weight:600}
.flat-card p{font-size:var(--t-ui);color:var(--muted);line-height:var(--lh-head);margin:0}
.flat-sec-h{font-family:var(--fm);font-size:var(--t-micro);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin:0 0 12px;display:flex;align-items:center;gap:9px;font-weight:500}
.flat-sec-h::after{content:'';flex:1;height:1px;background:var(--line)}

#legend{position:fixed;left:18px;bottom:62px;z-index:30;display:flex;gap:6px;flex-wrap:wrap;max-width:54vw}
@media(max-width:820px){#legend{display:none}}
#toast{position:fixed;left:50%;top:74px;transform:translate(-50%,-14px);z-index:70;background:var(--surface-2);
  border:1px solid var(--line-str);border-radius:var(--r-sm);padding:11px 18px;font-size:var(--t-ui);opacity:0;
  pointer-events:none;transition:.3s var(--ease);box-shadow:0 16px 44px rgba(0,0,0,.55);
  max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:640px){
  .brand-t{display:none}
  #search{width:128px} #search:focus{width:168px}
  #panel{width:100vw}
  .tiles{grid-template-columns:1fr}
  #prox{bottom:88px}
}
</style>
</head>
<body>

<div id="stage"><canvas id="canvas"></canvas></div>
<div id="vignette"></div>
<div id="labels"></div>

<div id="loader">
  <div class="ld-w">
    <div class="ld-mark">
      <div class="ld-ring"></div><div class="ld-ring"></div><div class="ld-ring"></div><div class="ld-core"></div>
    </div>
    <h1 class="ld-t">ACTMON</h1>
    <p class="ld-s">Interactive platform documentation<br />Built from repository inspection</p>
    <div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div>
    <p class="ld-step" id="ldStep">Initialising…</p>
  </div>
</div>

<header id="top">
  <button class="brand" id="home" title="Back to the platform overview">
    <span class="brand-dot"></span><span class="brand-t">ACTMON</span>
  </button>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <span class="spacer"></span>
  <span class="lvl" id="lvl">Level 0 · Platform</span>
  <div id="searchWrap">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search features…" autocomplete="off" aria-label="Search features" />
    <div id="results" role="listbox"></div>
  </div>
</header>

<div id="envBar"><h2 id="envTitle"></h2><p id="envSub"></p></div>

<div id="prox" role="status" aria-live="polite"></div>

<footer id="bottom">
  <button class="btn" id="back" title="Back (Backspace)" disabled>
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>Back
  </button>
  <button class="btn" id="fwd" title="Forward" disabled>Forward
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <button class="btn" id="reset" title="Reset to overview (0)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset
  </button>
  <button class="btn" id="tourBtn" title="Guided cinematic tour (T)">
    <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l13 8-13 8z"/></svg>Guided tour
  </button>
  <button class="btn" id="flatBtn" title="2D accessible view (F)">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>2D view
  </button>
  <button class="btn" id="motionBtn" title="Reduce motion (M)">Reduce motion</button>
  <button class="btn" id="fsBtn" title="Full screen">Full screen</button>
  <span class="hint">Scroll to zoom · drag to orbit · shift-drag to pan · click to select · Enter to descend · ? for keys</span>
</footer>

<div id="legend"></div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="pTitle">
  <div class="p-head">
    <div class="p-kicker" id="pKicker"></div>
    <h2 class="p-title" id="pTitle"></h2>
    <p class="p-sub" id="pSub"></p>
    <button class="p-close" id="pClose" aria-label="Close panel">&times;</button>
  </div>
  <div class="p-body" id="pBody"></div>
</aside>

<div id="tour" role="region" aria-label="Guided tour">
  <div class="tour-top"><span class="tour-n" id="tourN"></span><h3 class="tour-t" id="tourT"></h3></div>
  <p class="tour-b" id="tourB"></p>
  <div class="tour-ctl">
    <button class="btn" id="tourPrev">Previous</button>
    <button class="btn" id="tourPause">Pause</button>
    <button class="btn primary" id="tourNext">Next</button>
    <div class="tour-prog"><i id="tourProg"></i></div>
    <button class="btn" id="tourExit">Exit</button>
  </div>
</div>

<div id="flat"><div class="flat-w" id="flatBody"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="./interactive/actmon-data.js"></script>
<script src="./interactive/actmon-samples.js"></script>
<script src="./interactive/actmon-engines.js"></script>
<script src="./interactive/actmon-scene.js"></script>
<script src="./interactive/actmon-envs.js"></script>
<script src="./interactive/actmon-app.js"></script>
</body>
</html>
