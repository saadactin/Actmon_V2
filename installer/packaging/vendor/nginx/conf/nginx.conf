worker_processes  1;
events { worker_connections  1024; }
http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    server {
        listen       19182;
        server_name  localhost;
        root   "E:/ACTMON V1/frontend/dist";
        index  index.html;

        location /api/v1/cloud/ {
            proxy_pass http://127.0.0.1:18004;
            proxy_set_header Host $http_host;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:18003;
            proxy_set_header Host $http_host;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
